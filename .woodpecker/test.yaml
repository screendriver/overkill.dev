---
when:
    - event: pull_request
    - event: push
      branch: main
    - event: manual

labels:
    platform: linux/amd64

steps:
    - name: install
      image: node:26.13.1
      commands:
          - npm clean-install

    - name: test
      image: node:26.13.1
      commands:
          - npx just test
          - npx just lint
